<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Module Tutorials!</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <h2 class="text-red-600">Welcome to the new module tutorials!</h2>
    <h2 class="text-slate-950">Welcome to the new module tutorials!</h2>
    <h3 class="text-yellow-200">Hello World!</h3>

    <div class="w-full max-w-sm overflow-hidden rounded-2xl bg-white shadow-xl transition duration-300 hover:-translate-y-2 hover:shadow-2xl">

    <!-- Product Image -->
    <div class="relative bg-blue-100 p-6">
      <span class="absolute left-4 top-4 rounded-full bg-blue-600 px-3 py-1 text-xs font-semibold text-white">
        Best Seller
      </span>

      <img
        src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=700"
        alt="MacBook laptop"
        class="h-52 w-full rounded-xl object-cover"
      />
    </div>

    <!-- Product Details -->
    <div class="p-6">
      <p class="text-sm font-semibold uppercase tracking-widest text-blue-600">
        Electronics
      </p>

      <h2 class="mt-2 text-2xl font-bold text-slate-900">
        MacBook Pro
      </h2>

      <div class="mt-2 flex items-center gap-2">
        <span class="text-yellow-400">★★★★★</span>
        <span class="text-sm text-slate-500">(120 reviews)</span>
      </div>

      <p class="mt-4 text-sm leading-6 text-slate-600">
        Powerful performance, premium design, and a stunning display
        for your everyday work and creativity.
      </p>

      <!-- Price -->
      <div class="mt-5 flex items-center gap-3">
        <span class="text-3xl font-bold text-blue-700">$1,099</span>
        <span class="text-lg text-slate-400 line-through">$1,299</span>
      </div>

      <!-- Button -->
      <button
        class="mt-5 w-full rounded-xl bg-blue-600 px-5 py-3 font-semibold text-white transition duration-200 hover:bg-blue-700 active:scale-95 focus:outline-none focus:ring-4 focus:ring-blue-200"
      >
        Add to Cart
      </button>
    </div>
  </div>

</body>
</html>
